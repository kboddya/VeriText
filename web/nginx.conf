upstream veritext_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Compression for JSON API payloads, Markdown reports, CSV exports & static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/markdown
        text/csv
        text/tab-separated-values
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body size & timeout limits for large documents and CSV datasets
    client_max_body_size 250M;
    client_body_buffer_size 16M;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    # Static assets caching
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Static web client
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to the backend inference container
    location /api/ {
        proxy_pass http://veritext_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
