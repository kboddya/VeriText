[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritext"
version = "1.0.0"
description = "VeriText — AI Text & Document Authenticity Detector (RuBERT-AI & DeBERTa-v3)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.20.0",
  "numpy>=1.24.0",
  "safetensors>=0.4.0",
  "torch>=2.1.0",
  "transformers>=4.38.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.0.0",
  "brotli>=1.2.0",
  "brotlicffi>=1.2.0",
  "rich>=13.0.0",
  "sentencepiece>=0.1.99",
  "protobuf>=3.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
veritext = "backend.cli:main"
veritext-web = "backend.cli:run_web_entrypoint"

[tool.setuptools]
packages = ["backend", "backend.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
